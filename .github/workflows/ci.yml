# Pull-request checks.
#
# deploy-pages.yml only runs on push to develop, and it publishes. Without this
# workflow the first automated check of any change is the production deploy.
# This runs the same gates as that workflow's `build` job (plus lint) on every
# PR into develop, and never deploys: it has read-only permissions and no
# upload or Pages steps.
#
# Keep the setup steps (pnpm and Node versions, frozen install) in step with
# deploy-pages.yml, or a PR can pass here and still fail the deploy.
name: CI

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR supersedes the run in progress. Safe here, unlike
# in the deploy workflow: nothing is published.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        # Pinned to `packageManager` in the root package.json, as in deploy-pages.yml.
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          # Must match deploy-pages.yml: apps/web-v2 requires Node 22.x.
          node-version: 22.11.0
          cache: pnpm

      - name: Install dependencies
        # Fails a PR that changes package.json without updating pnpm-lock.yaml,
        # which is exactly what the deploy would fail on.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check-types

      - name: Lint
        # ESLint in apps/web and packages/*, Biome in apps/web-v2.
        run: pnpm lint

      - name: Build V1 (apps/web)
        # No secrets on PRs: /blog falls back to the seeded posts, the contact
        # form to mailto:, and the contribution graph is omitted. All three are
        # supported build modes, so this still proves the export builds.
        run: pnpm web:build
        env:
          NEXT_PUBLIC_BASE_URL: https://rahul-rocket.github.io

      - name: Build V2 (apps/web-v2)
        run: pnpm web-v2:build

      - name: Gate V2 export
        run: pnpm web-v2:verify

      - name: Test V2
        run: pnpm web-v2:test

      - name: Assemble the Pages artifact
        # Runs the same layout assertions as the deploy, without uploading anything.
        run: pnpm pages:assemble

      - name: Hand the assembled artifact to the e2e and Lighthouse jobs
        # Built once here; the jobs below test exactly these bytes rather than
        # rebuilding (and possibly drifting) per job.
        uses: actions/upload-artifact@v4
        with:
          name: pages
          path: _pages/
          retention-days: 3

  e2e:
    # V2's Playwright suite, against the real static export (playwright.config.ts
    # serves out/ via serve-preview.mjs, never `next dev`).
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: pages
          path: _pages/

      - name: Restore V2's export as apps/web-v2/out
        # _pages/v2/ is V2's out/ copied verbatim by assemble-pages.mjs.
        run: cp -r _pages/v2 apps/web-v2/out

      - name: Install Playwright browsers
        run: pnpm --filter web-v2 exec playwright install --with-deps chromium webkit

      - name: Run e2e
        run: pnpm --filter web-v2 test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web-v2/playwright-report/
          retention-days: 7

  lighthouse:
    # Audits the same pages of V1 and V2 from the assembled artifact, so the two
    # are scored under identical conditions. Assertions are warnings for now:
    # this job measures and compares; it does not yet gate a merge.
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: pages
          path: _pages/

      - name: Run Lighthouse on V1 and V2
        run: pnpm pages:lighthouse

      - name: Write the V1-vs-V2 table to the job summary
        if: ${{ !cancelled() }}
        run: node scripts/lighthouse-summary.mjs

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7
