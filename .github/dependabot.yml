version: 2

updates:
  # One entry for the whole pnpm workspace. Run from the root, Dependabot updates
  # every workspace package (apps/*, packages/*) *and* the single root
  # pnpm-lock.yaml. Per-directory entries cannot see that lockfile, so their PRs
  # changed package.json alone and failed `pnpm install --frozen-lockfile` in
  # the deploy. Do not add per-directory npm entries back.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    groups:
      # React and its types move together across both apps: AGENTS.md requires
      # web and web-v2 to pin the same @types/react / @types/react-dom.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      radix:
        patterns: ["@radix-ui/*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Held deliberately -- see AGENTS.md and apps/web-v2/CLAUDE.md before lifting.
      # ESLint stays on 8 until packages/eslint-config moves to flat config;
      # eslint-config-next 16 requires ESLint >= 9, so it is held with it.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      # web-v2 runs on Node 22 (engines), so its @types/node stays on 22.x.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Pinned to the dev container's Chromium build; bump by hand with it.
      - dependency-name: "@playwright/test"
      # Major upgrades are migrations, done by hand: Next 16 for web-v2,
      # TypeScript 7, Vite 8.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@next/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "github-actions"]
