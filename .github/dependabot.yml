version: 2

updates:
  # Root workspace: shared tooling (turbo, typescript, prettier).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    groups:
      dev-tooling:
        patterns: ["turbo", "typescript", "prettier", "eslint*", "@typescript-eslint/*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ["dependencies", "apps/web"]
    groups:
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/packages/ui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ["dependencies", "packages/ui"]
    groups:
      radix:
        patterns: ["@radix-ui/*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/packages/eslint-config"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
    groups:
      lint-tooling:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "github-actions"]
